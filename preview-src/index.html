<!doctype html><html><head><meta charset="utf-8"><title>Whistle preview</title>
<link rel="stylesheet" href="poster.css">
<style>:root{--accent:#b9a3e3;--accent-deep:#5e4b8b;--glow:rgba(185,163,227,.07)}
.mini{position:absolute;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:2px solid var(--accent);border-bottom-width:6px;background:#1d1a26;color:var(--fg);font-size:18px;font-weight:700;box-shadow:0 0 18px rgba(185,163,227,.3)}
.cap.inf{min-width:96px;font-size:40px;background:#1d1a26;border-color:var(--accent);color:var(--accent);box-shadow:0 0 28px rgba(185,163,227,.45),0 0 70px rgba(185,163,227,.18)}
.star{position:absolute;line-height:1;text-shadow:0 0 12px rgba(185,163,227,.7)}
.dot{position:absolute;width:4px;height:4px;background:var(--fg);box-shadow:0 0 8px var(--accent)}
.zoom{border-color:var(--accent)!important;box-shadow:12px 12px 0 #0a0b0d,0 0 40px rgba(185,163,227,.18)!important}
</style></head><body>
<div class="left" style="top:0;bottom:0;display:flex;flex-direction:column;justify-content:center">
  <div class="title" style="margin-top:0"><span class="plain">WHISTLE</span><span class="box">MODE</span></div>
  <div class="head">Drive Herdr from the <em>keyboard.</em></div>
  <div class="body"><b>Ctrl+Space</b> and the keyboard takes over. Jump between panes, split and zoom, switch tabs and spaces, open any panel or command, all without touching the mouse.</div>
  <div class="chips"><span class="chip solid">HERDR MOD</span></div>
</div>
<div class="url">github.com/<b>Tuuxic/herdr-whistle</b></div>
<div class="shot" style="left:830px;top:170px;width:710px;height:382px"><img src="shot.png" style="left:0;top:0;transform:scale(.37);transform-origin:0 0"></div>
<div class="shot zoom" style="left:826px;top:506px;width:690px;height:105px"><img src="shot.png" style="left:-410px;top:-1180px;transform:scale(1.25);transform-origin:0 0"></div>

      <span style="font-size:28px;color:var(--dim);margin-left:10px">→</span>
    </div>

class="dot" style="left:456px;top:160px"></span><span class="dot" style="left:630px;top:60px"></span><span class="dot" style="left:586px;top:170px"></span><span class="dot" style="left:720px;top:70px"></span><span class="dot" style="left:668px;top:128px"></span><span class="dot" style="left:508px;top:96px"></span>
  </div>
</body></html>
