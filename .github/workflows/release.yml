# The release (ADR 0002): `main` is the release, so a push to `main` (merging the pull request
# next -> main) tags it. It reads VERSION from mods/whistle/version.js; if the tag v<VERSION>
# doesn't exist yet, it tags this commit, pushes the tag, and makes a GitHub release named after
# it whose notes are that version's CHANGELOG.md entry. When the tag exists it does nothing.
# scripts/release.sh reads both (tests/run.sh checks it).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(bash scripts/release.sh version)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists: nothing to release."
            exit 0
          fi
          bash scripts/release.sh notes "${tag#v}" > "$RUNNER_TEMP/notes.md"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
